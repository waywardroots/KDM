name: Build iPad AUv3 + Standalone

# Compiles the iPad app (Standalone app with the AUv3 extension embedded) on a
# macOS runner to catch build breaks. It is NOT code-signed, so the result can't
# be installed on an iPad - sign and install from Xcode on your Mac instead (see
# "iPad (AUv3 + Standalone)" in README.md).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ios-auv3:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Xcode, iOS)
        # ../JUCE isn't present in CI, so CMake downloads JUCE 8.0.9 via FetchContent.
        run: >
          cmake -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Build (Release, unsigned) - Standalone app + AUv3 extension
        run: >
          cmake --build build-ios --config Release --target KeyDetector_Standalone --
          -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Check the AUv3 extension is embedded
        run: |
          APP="$(find build-ios -name 'Key Detector.app' -path '*Release-iphoneos*' | head -1)"
          echo "App: $APP"
          ls -la "$APP/PlugIns"
          test -d "$APP/PlugIns/Key Detector.appex"
