name: Build iPad app

# Compiles the standalone iPad app on a macOS runner to catch build breaks. It
# is NOT code-signed, so the result can't be installed on an iPad - sign and install from Xcode on your Mac instead (see
# "iPad app" in README.md).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ios-app:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Xcode, iOS)
        # ../JUCE isn't present in CI, so CMake downloads JUCE 8.0.9 via FetchContent.
        run: >
          cmake -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Build (Release, unsigned)
        run: >
          cmake --build build-ios --config Release --target KeyDetector_Standalone --
          -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Check the app was built
        run: |
          APP="$(find build-ios -name 'Key Detector.app' -path '*Release-iphoneos*' | head -1)"
          echo "App: $APP"
          test -n "$APP" && test -f "$APP/Info.plist"
