name: Build iPad app

# Builds the SwiftUI iPad app in iPad/KDM.xcodeproj on a macOS runner and runs the
# analysis-engine tests. The app is NOT code-signed, so the result can't be
# installed on an iPad - open the project in Xcode on your Mac for that (see
# iPad/README.md).

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analysis engine tests (C++, no JUCE)
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra -ISource -IiPad/KDM/Engine \
            tests/AnalysisEngineTest.cpp iPad/KDM/Engine/AnalysisEngine.cpp \
            Source/ChromaKeyDetector.cpp Source/PitchDetector.cpp Source/TempoEstimator.cpp \
            -o analysis-engine-test
          ./analysis-engine-test

  stagelinq:
    # The StageLinQ package (Denon / Engine DJ network data): build, the Mac
    # monitor tool, and the codec + key parsing tests.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        working-directory: iPad/StageLinQ
        run: swift build

      - name: Test
        working-directory: iPad/StageLinQ
        run: swift test

      - name: Build for iPad
        working-directory: iPad/StageLinQ
        run: xcodebuild -scheme StageLinQ -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO build

  ipad-app:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Release, unsigned, generic iPad device)
        run: >
          xcodebuild
          -project iPad/KDM.xcodeproj
          -scheme KDM
          -configuration Release
          -destination "generic/platform=iOS"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Build (Debug, iPad simulator)
        run: >
          xcodebuild
          -project iPad/KDM.xcodeproj
          -scheme KDM
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
